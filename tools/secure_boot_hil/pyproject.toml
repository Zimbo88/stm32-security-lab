[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-boot-hil"
version = "0.1.0"
description = "Hardware-in-the-loop validation framework for the STM32 secure-boot stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==7.4.4",
  "ruff==0.16.5",
]
plots = [
  "matplotlib>=3.8",
]

[project.scripts]
secure-boot-hil = "secure_boot_hil.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secure_boot_hil*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
