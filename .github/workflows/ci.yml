name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-and-firmware:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            make
          arm-none-eabi-gcc --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check generated memory layout
        run: python tools/emit_memory_layout.py --check

      - name: Run Python and host tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -q -p no:cacheprovider tests

      - name: Build firmware projects
        run: |
          make -C firmware/exp045_bootloader_v2 clean all
          make -C firmware/exp065_signed_app clean all
          make -C firmware/exp066_research_platform_core clean all

      - name: Run host C verifier tests
        run: |
          make -C tests/host_verifier clean test
          make -C tests/host_verifier clean test SANITIZE=1

      - name: Check deterministic builds
        run: python tools/check_deterministic_build.py

      - name: Scan tracked files for private key material
        run: python tools/check_no_private_keys.py

      - name: Check whitespace
        run: git diff --check
