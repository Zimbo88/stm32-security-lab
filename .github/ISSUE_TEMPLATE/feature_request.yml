name: Feature request
description: Suggest a scoped research-platform improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Large product features, automatic protection changes and unsafely
        bypassing signature or recovery policy are outside the default scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem or research question
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test and documentation plan
    validations:
      required: true
