source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

init
reset halt

echo "=== UID TEST ==="

set uid0 [read_memory 0x1FFF7A10 32 1]
echo "UID0=$uid0"

set uid1 [read_memory 0x1FFF7A14 32 1]
echo "UID1=$uid1"

set uid2 [read_memory 0x1FFF7A18 32 1]
echo "UID2=$uid2"

shutdown
