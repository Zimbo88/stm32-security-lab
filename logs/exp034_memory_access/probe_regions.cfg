source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

proc probe {name address width} {
    if {[catch {read_memory $address $width 1} value]} {
        echo "$name|$address|$width|FAIL"
    } else {
        echo "$name|$address|$width|OK|$value"
    }
}

init
reset halt

echo "=== EXP034 MEMORY ACCESS MATRIX ==="
echo "FORMAT: NAME|ADDRESS|WIDTH|STATUS|VALUE"

probe CORE_CPUID       0xE000ED00 32
probe DBGMCU_IDCODE    0xE0042000 32
probe FLASH_OPTCR      0x40023C14 32
probe SRAM_START       0x20000000 32
probe FLASH_START      0x08000000 32
probe SYSTEM_ROM_START 0x1FFF0000 32
probe UID0             0x1FFF7A10 32
probe UID1             0x1FFF7A14 32
probe UID2             0x1FFF7A18 32
probe FLASH_SIZE       0x1FFF7A22 16

echo "EXP034_MATRIX_COMPLETE"

shutdown
