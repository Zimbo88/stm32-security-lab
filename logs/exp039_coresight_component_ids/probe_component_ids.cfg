source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

proc probe32 {name address} {
    if {[catch {read_memory $address 32 1} value]} {
        echo "$name|$address|FAIL"
    } else {
        echo "$name|$address|OK|$value"
    }
}

proc probe_component_ids {prefix base} {
    # Peripheral ID registers
    probe32 "${prefix}_PID4" [expr {$base + 0xFD0}]
    probe32 "${prefix}_PID5" [expr {$base + 0xFD4}]
    probe32 "${prefix}_PID6" [expr {$base + 0xFD8}]
    probe32 "${prefix}_PID7" [expr {$base + 0xFDC}]
    probe32 "${prefix}_PID0" [expr {$base + 0xFE0}]
    probe32 "${prefix}_PID1" [expr {$base + 0xFE4}]
    probe32 "${prefix}_PID2" [expr {$base + 0xFE8}]
    probe32 "${prefix}_PID3" [expr {$base + 0xFEC}]

    # Component ID registers
    probe32 "${prefix}_CID0" [expr {$base + 0xFF0}]
    probe32 "${prefix}_CID1" [expr {$base + 0xFF4}]
    probe32 "${prefix}_CID2" [expr {$base + 0xFF8}]
    probe32 "${prefix}_CID3" [expr {$base + 0xFFC}]
}

init
reset halt

echo "=== EXP039 CORESIGHT COMPONENT IDENTIFICATION ==="
echo "FORMAT: NAME|ADDRESS|STATUS|VALUE"

# Cortex-M CoreSight ROM table
probe32 ROM_ENTRY_00 0xE00FF000
probe32 ROM_ENTRY_01 0xE00FF004
probe32 ROM_ENTRY_02 0xE00FF008
probe32 ROM_ENTRY_03 0xE00FF00C
probe32 ROM_ENTRY_04 0xE00FF010
probe32 ROM_ENTRY_05 0xE00FF014
probe32 ROM_ENTRY_06 0xE00FF018
probe32 ROM_ENTRY_07 0xE00FF01C
probe32 ROM_ENTRY_08 0xE00FF020
probe32 ROM_ENTRY_09 0xE00FF024
probe32 ROM_ENTRY_10 0xE00FF028
probe32 ROM_ENTRY_11 0xE00FF02C
probe32 ROM_ENTRY_12 0xE00FF030
probe32 ROM_ENTRY_13 0xE00FF034
probe32 ROM_ENTRY_14 0xE00FF038
probe32 ROM_ENTRY_15 0xE00FF03C

# Known Cortex-M4 CoreSight component windows
probe_component_ids ITM      0xE0000000
probe_component_ids DWT      0xE0001000
probe_component_ids FPB      0xE0002000
probe_component_ids SCS      0xE000E000
probe_component_ids TPIU     0xE0040000
probe_component_ids ETM      0xE0041000
probe_component_ids ROMTABLE 0xE00FF000

echo "EXP039_COMPONENT_IDS_COMPLETE"

shutdown
