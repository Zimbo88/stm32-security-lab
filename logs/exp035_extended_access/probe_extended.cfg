source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

proc probe {name address width} {
    if {[catch {read_memory $address $width 1} value]} {
        echo "$name|$address|$width|FAIL"
    } else {
        echo "$name|$address|$width|OK|$value"
    }
}

init
reset halt

echo "=== EXP035 EXTENDED READ-ONLY ACCESS SURVEY ==="
echo "FORMAT: NAME|ADDRESS|WIDTH|STATUS|VALUE"

echo "SECTION|CONTROL"
probe SCB_CPUID          0xE000ED00 32
probe SCB_VTOR           0xE000ED08 32
probe DBGMCU_IDCODE      0xE0042000 32
probe FLASH_OPTCR        0x40023C14 32

echo "SECTION|MEMORY_ALIAS"
probe ALIAS_START_32     0x00000000 32
probe ALIAS_START_16     0x00000000 16
probe ALIAS_START_8      0x00000000 8

echo "SECTION|INTERNAL_FLASH"
probe FLASH_000000_32    0x08000000 32
probe FLASH_000000_16    0x08000000 16
probe FLASH_000000_8     0x08000000 8
probe FLASH_004000       0x08004000 32
probe FLASH_010000       0x08010000 32
probe FLASH_020000       0x08020000 32
probe FLASH_040000       0x08040000 32
probe FLASH_080000       0x08080000 32
probe FLASH_100000       0x08100000 32

echo "SECTION|SRAM"
probe SRAM_20000000      0x20000000 32
probe SRAM_20001000      0x20001000 32
probe SRAM_20010000      0x20010000 32
probe SRAM_2001BFFC      0x2001BFFC 32
probe SRAM_2001C000      0x2001C000 32
probe SRAM_2001FFFC      0x2001FFFC 32
probe SRAM_20020000      0x20020000 32
probe SRAM_2002FFFC      0x2002FFFC 32

echo "SECTION|CCM"
probe CCM_START          0x10000000 32
probe CCM_MIDDLE         0x10008000 32
probe CCM_END            0x1000FFFC 32

echo "SECTION|SYSTEM_MEMORY"
probe SYSTEM_START       0x1FFF0000 32
probe SYSTEM_MIDDLE      0x1FFF4000 32
probe UID0_32            0x1FFF7A10 32
probe UID0_16            0x1FFF7A10 16
probe UID0_8             0x1FFF7A10 8
probe UID1               0x1FFF7A14 32
probe UID2               0x1FFF7A18 32
probe FLASH_SIZE_16      0x1FFF7A22 16
probe FLASH_SIZE_8       0x1FFF7A22 8

echo "SECTION|PERIPHERALS"
probe RCC_CR             0x40023800 32
probe RCC_CSR            0x40023874 32
probe PWR_CR             0x40007000 32
probe SYSCFG_MEMRMP      0x40013800 32
probe GPIOA_MODER        0x40020000 32
probe GPIOB_MODER        0x40020400 32

echo "EXP035_EXTENDED_COMPLETE"

shutdown
