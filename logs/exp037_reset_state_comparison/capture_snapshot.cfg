source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

if {![info exists SNAPSHOT_NAME]} {
    set SNAPSHOT_NAME "UNNAMED"
}

if {![info exists RESET_MODE]} {
    set RESET_MODE "RESET_HALT"
}

proc probe32 {name address} {
    if {[catch {read_memory $address 32 1} value]} {
        echo "$name|$address|FAIL"
    } else {
        echo "$name|$address|OK|$value"
    }
}

proc probe_reg {name register_name} {
    if {[catch {reg $register_name} value]} {
        echo "$name|REG:$register_name|FAIL"
        return
    }

    if {[regexp {0x[0-9A-Fa-f]+} $value matched]} {
        echo "$name|REG:$register_name|OK|$matched"
    } else {
        echo "$name|REG:$register_name|FAIL"
    }
}

init

if {$RESET_MODE eq "HALT_ONLY"} {
    halt
} elseif {$RESET_MODE eq "RESET_HALT"} {
    reset halt
} else {
    echo "EXP037_ERROR|UNKNOWN_RESET_MODE|$RESET_MODE"
    shutdown error
}

echo "=== EXP037 STATE SNAPSHOT ==="
echo "SNAPSHOT|$SNAPSHOT_NAME"
echo "RESET_MODE|$RESET_MODE"
echo "FORMAT: NAME|ADDRESS_OR_REGISTER|STATUS|VALUE"

probe_reg CORE_PC          pc
probe_reg CORE_MSP         msp
probe_reg CORE_PSP         psp
probe_reg CORE_XPSR        xpsr
probe_reg CORE_CONTROL     control
probe_reg CORE_PRIMASK     primask
probe_reg CORE_BASEPRI     basepri
probe_reg CORE_FAULTMASK   faultmask

probe32 SCB_CPUID          0xE000ED00
probe32 SCB_ICSR           0xE000ED04
probe32 SCB_VTOR           0xE000ED08
probe32 SCB_AIRCR          0xE000ED0C
probe32 SCB_SCR            0xE000ED10
probe32 SCB_CCR            0xE000ED14
probe32 SCB_SHCSR          0xE000ED24
probe32 SCB_CFSR           0xE000ED28
probe32 SCB_HFSR           0xE000ED2C
probe32 SCB_DFSR           0xE000ED30
probe32 SCB_MMFAR          0xE000ED34
probe32 SCB_BFAR           0xE000ED38
probe32 SCB_AFSR           0xE000ED3C

probe32 COREDEBUG_DHCSR    0xE000EDF0
probe32 COREDEBUG_DEMCR    0xE000EDFC

probe32 DBGMCU_IDCODE      0xE0042000

probe32 FLASH_SR           0x40023C0C
probe32 FLASH_CR           0x40023C10
probe32 FLASH_OPTCR        0x40023C14
probe32 FLASH_OPTCR1       0x40023C18

probe32 RCC_CR             0x40023800
probe32 RCC_CFGR           0x40023808
probe32 RCC_CSR            0x40023874

probe32 PWR_CR             0x40007000
probe32 SYSCFG_MEMRMP      0x40013800

echo "EXP037_SNAPSHOT_COMPLETE|$SNAPSHOT_NAME"

shutdown
