source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

if {![info exists RUN_NAME]} {
    set RUN_NAME "UNNAMED"
}

proc probe32 {name address} {
    if {[catch {read_memory $address 32 1} value]} {
        echo "$name|$address|FAIL"
    } else {
        echo "$name|$address|OK|$value"
    }
}

init
reset halt

echo "=== EXP038 ACCESS CONSISTENCY ==="
echo "RUN|$RUN_NAME"
echo "FORMAT: NAME|ADDRESS|STATUS|VALUE"

# Core and debug
probe32 SCB_CPUID          0xE000ED00
probe32 SCB_VTOR           0xE000ED08
probe32 COREDEBUG_DHCSR    0xE000EDF0
probe32 DBGMCU_IDCODE      0xE0042000

# Flash controller and option registers
probe32 FLASH_SR           0x40023C0C
probe32 FLASH_CR           0x40023C10
probe32 FLASH_OPTCR        0x40023C14
probe32 FLASH_OPTCR1       0x40023C18

# Peripherals
probe32 RCC_CR             0x40023800
probe32 RCC_CFGR           0x40023808
probe32 RCC_CSR            0x40023874
probe32 PWR_CR             0x40007000
probe32 SYSCFG_MEMRMP      0x40013800
probe32 GPIOA_MODER        0x40020000

# RAM regions
probe32 SRAM_START         0x20000000
probe32 SRAM_MIDDLE        0x20010000
probe32 SRAM_END           0x2002FFFC
probe32 CCM_START          0x10000000
probe32 CCM_END            0x1000FFFC

# Previously inaccessible regions
probe32 FLASH_START        0x08000000
probe32 FLASH_VECTOR_1     0x08000004
probe32 FLASH_ALIAS        0x00000000
probe32 SYSTEM_ROM         0x1FFF0000
probe32 UID0               0x1FFF7A10
probe32 UID1               0x1FFF7A14
probe32 UID2               0x1FFF7A18
probe32 FLASH_SIZE         0x1FFF7A22

echo "EXP038_ACCESS_COMPLETE|$RUN_NAME"
shutdown
