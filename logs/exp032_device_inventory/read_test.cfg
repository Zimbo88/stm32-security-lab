source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]
adapter speed 1000

init
reset halt

echo "EXP032 MINIMAL READ TEST"

set cpuid [read_memory 0xE000ED00 32 1]
echo "SCB_CPUID=$cpuid"

set idcode [read_memory 0xE0042000 32 1]
echo "DBGMCU_IDCODE=$idcode"

set optcr [read_memory 0x40023C14 32 1]
echo "FLASH_OPTCR=$optcr"

echo "EXP032 MINIMAL READ TEST COMPLETE"

resume
shutdown
