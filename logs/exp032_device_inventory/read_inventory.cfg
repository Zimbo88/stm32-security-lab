source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 1000
source [find target/stm32f4x.cfg]

init
reset halt

echo "============================================================"
echo "EXP032 STM32F429 READ-ONLY DEVICE INVENTORY"
echo "============================================================"

echo ""
echo "ARM SCB REGISTERS"
echo "SCB_CPUID  0xE000ED00"
mdw 0xE000ED00 1
echo "SCB_VTOR   0xE000ED08"
mdw 0xE000ED08 1
echo "SCB_AIRCR  0xE000ED0C"
mdw 0xE000ED0C 1
echo "SCB_SHCSR  0xE000ED24"
mdw 0xE000ED24 1
echo "SCB_CFSR   0xE000ED28"
mdw 0xE000ED28 1
echo "SCB_HFSR   0xE000ED2C"
mdw 0xE000ED2C 1

echo ""
echo "STM32 DEVICE IDENTIFICATION"
echo "DBGMCU_IDCODE 0xE0042000"
mdw 0xE0042000 1
echo "FLASH SIZE in KiB at 0x1FFF7A22"
mdh 0x1FFF7A22 1

echo ""
echo "96-BIT UNIQUE DEVICE IDENTIFIER"
echo "UID base 0x1FFF7A10"
mdw 0x1FFF7A10 3

echo ""
echo "FLASH CONTROL"
echo "FLASH_ACR    0x40023C00"
mdw 0x40023C00 1
echo "FLASH_SR     0x40023C0C"
mdw 0x40023C0C 1
echo "FLASH_CR     0x40023C10"
mdw 0x40023C10 1
echo "FLASH_OPTCR  0x40023C14"
mdw 0x40023C14 1
echo "FLASH_OPTCR1 0x40023C18"
mdw 0x40023C18 1

echo ""
echo "RESET AND CLOCK CONTROL"
echo "RCC_CR    0x40023800"
mdw 0x40023800 1
echo "RCC_PLLCFGR 0x40023804"
mdw 0x40023804 1
echo "RCC_CFGR  0x40023808"
mdw 0x40023808 1
echo "RCC_CIR   0x4002380C"
mdw 0x4002380C 1
echo "RCC_BDCR  0x40023870"
mdw 0x40023870 1
echo "RCC_CSR   0x40023874"
mdw 0x40023874 1

echo ""
echo "DEBUG CONTROL"
echo "DBGMCU_CR      0xE0042004"
mdw 0xE0042004 1
echo "DBGMCU_APB1FZ  0xE0042008"
mdw 0xE0042008 1
echo "DBGMCU_APB2FZ  0xE004200C"
mdw 0xE004200C 1

echo ""
echo "END OF READ-ONLY INVENTORY"
resume
shutdown
