source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]
adapter speed 1000

proc read32 {name address} {
    set value [read_memory $address 32 1]
    echo "$name|$address|$value"
}

init
reset halt

echo "============================================================"
echo "EXP032 ACCESSIBLE REGISTER INVENTORY"
echo "FORMAT: NAME|ADDRESS|VALUE"
echo "SYSTEM MEMORY 0x1FFFxxxx IS OMITTED"
echo "============================================================"

echo "SECTION|ARM_CORE_AND_SYSTEM_CONTROL"
read32 SCB_CPUID  0xE000ED00
read32 SCB_ICSR   0xE000ED04
read32 SCB_VTOR   0xE000ED08
read32 SCB_AIRCR  0xE000ED0C
read32 SCB_SCR    0xE000ED10
read32 SCB_CCR    0xE000ED14
read32 SCB_SHPR1  0xE000ED18
read32 SCB_SHPR2  0xE000ED1C
read32 SCB_SHPR3  0xE000ED20
read32 SCB_SHCSR  0xE000ED24
read32 SCB_CFSR   0xE000ED28
read32 SCB_HFSR   0xE000ED2C
read32 SCB_DFSR   0xE000ED30
read32 SCB_MMFAR  0xE000ED34
read32 SCB_BFAR   0xE000ED38
read32 SCB_AFSR   0xE000ED3C
read32 SCB_CPACR  0xE000ED88

echo "SECTION|DEVICE_IDENTIFICATION"
read32 DBGMCU_IDCODE 0xE0042000
read32 DBGMCU_CR     0xE0042004
read32 DBGMCU_APB1_FZ 0xE0042008
read32 DBGMCU_APB2_FZ 0xE004200C

echo "SECTION|FLASH_CONTROLLER"
read32 FLASH_ACR    0x40023C00
read32 FLASH_SR     0x40023C0C
read32 FLASH_CR     0x40023C10
read32 FLASH_OPTCR  0x40023C14
read32 FLASH_OPTCR1 0x40023C18

echo "SECTION|RESET_AND_CLOCK_CONTROL"
read32 RCC_CR         0x40023800
read32 RCC_PLLCFGR    0x40023804
read32 RCC_CFGR       0x40023808
read32 RCC_CIR        0x4002380C
read32 RCC_AHB1RSTR   0x40023810
read32 RCC_AHB2RSTR   0x40023814
read32 RCC_AHB3RSTR   0x40023818
read32 RCC_APB1RSTR   0x40023820
read32 RCC_APB2RSTR   0x40023824
read32 RCC_AHB1ENR    0x40023830
read32 RCC_AHB2ENR    0x40023834
read32 RCC_AHB3ENR    0x40023838
read32 RCC_APB1ENR    0x40023840
read32 RCC_APB2ENR    0x40023844
read32 RCC_AHB1LPENR  0x40023850
read32 RCC_AHB2LPENR  0x40023854
read32 RCC_AHB3LPENR  0x40023858
read32 RCC_APB1LPENR  0x40023860
read32 RCC_APB2LPENR  0x40023864
read32 RCC_BDCR       0x40023870
read32 RCC_CSR        0x40023874
read32 RCC_SSCGR      0x40023880
read32 RCC_PLLI2SCFGR 0x40023884
read32 RCC_PLLSAICFGR 0x40023888
read32 RCC_DCKCFGR    0x4002388C

echo "SECTION|POWER_CONTROL"
read32 PWR_CR  0x40007000
read32 PWR_CSR 0x40007004

echo "SECTION|SYSCFG"
read32 SYSCFG_MEMRMP 0x40013800
read32 SYSCFG_PMC    0x40013804
read32 SYSCFG_EXTICR1 0x40013808
read32 SYSCFG_EXTICR2 0x4001380C
read32 SYSCFG_EXTICR3 0x40013810
read32 SYSCFG_EXTICR4 0x40013814
read32 SYSCFG_CMPCR   0x40013820

echo "SECTION|MPU"
read32 MPU_TYPE 0xE000ED90
read32 MPU_CTRL 0xE000ED94
read32 MPU_RNR  0xE000ED98
read32 MPU_RBAR 0xE000ED9C
read32 MPU_RASR 0xE000EDA0

echo "SECTION|SYSTICK"
read32 SYST_CSR   0xE000E010
read32 SYST_RVR   0xE000E014
read32 SYST_CVR   0xE000E018
read32 SYST_CALIB 0xE000E01C

echo "SECTION|FPU"
read32 FPU_FPCCR 0xE000EF34
read32 FPU_FPCAR 0xE000EF38
read32 FPU_FPDSCR 0xE000EF3C
read32 FPU_MVFR0 0xE000EF40
read32 FPU_MVFR1 0xE000EF44

echo "EXP032_ACCESSIBLE_INVENTORY_COMPLETE"

resume
shutdown
