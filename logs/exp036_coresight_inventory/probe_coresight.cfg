source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 1000

proc probe {name address} {
    if {[catch {read_memory $address 32 1} value]} {
        echo "$name|$address|FAIL"
    } else {
        echo "$name|$address|OK|$value"
    }
}

init
reset halt

echo "=== EXP036 CORESIGHT INVENTORY ==="
echo "FORMAT: NAME|ADDRESS|STATUS|VALUE"

probe COREDEBUG_DHCSR  0xE000EDF0
probe COREDEBUG_DCRSR  0xE000EDF4
probe COREDEBUG_DCRDR  0xE000EDF8
probe COREDEBUG_DEMCR  0xE000EDFC

probe SCB_CFSR         0xE000ED28
probe SCB_HFSR         0xE000ED2C
probe SCB_DFSR         0xE000ED30
probe SCB_MMFAR        0xE000ED34
probe SCB_BFAR         0xE000ED38
probe SCB_AFSR         0xE000ED3C

probe DWT_CTRL         0xE0001000
probe DWT_CYCCNT       0xE0001004
probe DWT_COMP0        0xE0001020
probe DWT_MASK0        0xE0001024
probe DWT_FUNCTION0    0xE0001028
probe DWT_COMP1        0xE0001030
probe DWT_MASK1        0xE0001034
probe DWT_FUNCTION1    0xE0001038

probe FPB_CTRL         0xE0002000
probe FPB_REMAP        0xE0002004
probe FPB_COMP0        0xE0002008
probe FPB_COMP1        0xE000200C
probe FPB_COMP2        0xE0002010
probe FPB_COMP3        0xE0002014
probe FPB_COMP4        0xE0002018
probe FPB_COMP5        0xE000201C

probe ITM_TER          0xE0000E00
probe ITM_TPR          0xE0000E40
probe ITM_TCR          0xE0000E80
probe ITM_LSR          0xE0000FB4
probe ITM_DEVTYPE      0xE0000FCC
probe ITM_PIDR0        0xE0000FE0
probe ITM_CIDR0        0xE0000FF0

probe TPIU_SSPSR       0xE0040000
probe TPIU_CSPSR       0xE0040004
probe TPIU_ACPR        0xE0040010
probe TPIU_SPPR        0xE00400F0
probe TPIU_FFSR        0xE0040300
probe TPIU_FFCR        0xE0040304
probe TPIU_DEVID       0xE0040FC8
probe TPIU_DEVTYPE     0xE0040FCC
probe TPIU_PIDR0       0xE0040FE0
probe TPIU_CIDR0       0xE0040FF0

probe SCNSCB_ICTR      0xE000E004
probe SCNSCB_ACTLR     0xE000E008
probe NVIC_ISER0       0xE000E100
probe NVIC_ISER1       0xE000E104
probe NVIC_ISER2       0xE000E108
probe NVIC_ISER3       0xE000E10C
probe NVIC_ISPR0       0xE000E200
probe NVIC_ISPR1       0xE000E204
probe NVIC_IABR0       0xE000E300
probe NVIC_IABR1       0xE000E304
probe NVIC_IPR0        0xE000E400
probe NVIC_IPR1        0xE000E404

echo "EXP036_CORESIGHT_COMPLETE"

shutdown
